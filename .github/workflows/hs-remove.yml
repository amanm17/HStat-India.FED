name: Remove a sector

# Takes a sector (hs_index/sectors/<id>/) out of HStat in one step: its tags
# and seed, the intake batch that added its own codes, those codes, and every
# chapter and heading only they used. Codes the sector shares with another
# stream (for example electronics) stay; only the sector tag goes.
#
# Run it from Actions > Remove a sector > Run workflow. Type the sector id
# twice. The index change is committed, then a reprocess rebuilds the
# snapshot without the sector (no Comtrade calls).
#
# To hide a sector without removing it, set "enabled": false in its
# sector.json instead and push.

on:
  workflow_dispatch:
    inputs:
      sector:
        description: "Sector id, as in hs_index/sectors/ (for example capital-goods)"
        required: true
      confirm:
        description: "Type the sector id again to confirm"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: hstat-index
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Confirm
        run: |
          if [ "${{ inputs.sector }}" != "${{ inputs.confirm }}" ]; then
            echo "::error::The two entries differ; nothing was removed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install -r requirements.txt

      - name: Remove from the index
        run: python pipeline/hs_intake.py --remove-sector "${{ inputs.sector }}" | tee remove.log

      - name: Whole-index check
        run: python pipeline/hs_index_check.py

      - name: Commit the index
        run: |
          git config user.name "hstat-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A hs_index config/hs6_universe.txt config/parent_universe.json \
                  config/hs_titles.json config/hs_official_children.json \
                  src/lib/hsnames.generated.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Sector removed: ${{ inputs.sector }}"
            git push
          fi

      - name: Rebuild the snapshot without it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monthly-refresh.yml -f depth=reprocess
