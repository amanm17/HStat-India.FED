name: QA

# The gates that already existed, on the path a code change actually takes.
#
# validate_snapshot and launch_sanity ran only inside the monthly data job, so
# they guarded data changes and nothing else. Cloudflare builds this repo on
# push and runs `npm run build`, which knows nothing about either. A frontend
# change that moved the schema constant could therefore reach production with
# the one check written to stop it never having run.
#
# This does not touch deployment. It runs beside it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Does the published snapshot hold together?
      - name: Snapshot QA
        run: python pipeline/validate_snapshot.py public/data/snapshots/current

      # Can this build read it, and is it real rather than a fixture?
      - name: Launch sanity
        run: python pipeline/launch_sanity.py

      # Does the HS index (hs_index/) follow its rules? Unique, whole-code
      # names; no overlapping search terms; real HS 2022 codes.
      - name: HS index check
        run: python pipeline/hs_index_check.py

      # Is every tariff-line name and heading written out in full? No DGCIS
      # abbreviations, no cut-off text (pipeline/dgcis/line_names.py).
      - name: Tariff-line name check
        run: python pipeline/dgcis/check_line_names.py

      # The estimation rules, on synthetic series: a filed value is never
      # replaced, a year an economy filed is never estimated, bounds hold.
      - name: Estimation tests
        run: cd pipeline && python test_estimate.py

      # Sectors: seeds well formed, the pull plan skips what a seed holds,
      # seeds go into and out of the raw store cleanly.
      - name: Sector tests
        run: cd pipeline && python test_sectors.py

      # Exactly what Cloudflare will run.
      - name: Build
        run: npm run build
